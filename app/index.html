<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outil terrain biodiversité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  /* Outil de terrain lisible en plein soleil : un seul thème clair à fort contraste, colonne téléphone, tuiles illustrées. */
  color-scheme: light;
  --bg: #EDF0EA;
  --card: #FFFFFF;
  --ink: #13201A;
  --muted: #4A574F;
  --line: #C6CFC6;
  --moss: #2C6A3E;
  --moss-bg: #E0EEDD;
  --amber: #8A5700;
  --amber-bg: #FCEECB;
  --amber-line: #D6A035;
  --high: #9E2219; --high-bg: #F8DCD8;
  --mid: #924F00; --mid-bg: #FBE7CF;
  --low: #2C6A3E; --low-bg: #E0EEDD;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --il-leaf: #7DAE69; --il-leaf2: #5A8E4E; --il-grass: #B9D49A; --il-field: #E6DBA5;
  --il-water: #8CC2D8; --il-bark: #946F4E; --il-bark2: #C9A781; --il-wall: #DAD6CD;
  --il-roof: #A9583F; --il-dark: #2B2B27; --il-stone: #B8B3A6; --il-mud: #9C8A6A;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.1; }
h2 { font-size: 19px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--moss); outline-offset: 2px; }
.top { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-line); }
.site { width: 100%; font: 700 17px/1.3 var(--body); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.hint { font-size: 14px; color: var(--muted); background: var(--card); border-radius: 10px; padding: 10px 12px; border: 1px dashed var(--line); display: flex; gap: 10px; align-items: center; }
.hint b { color: var(--ink); }
section { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-head small { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.q { display: flex; flex-direction: column; gap: 8px; }
.q p { margin: 0; font-size: 15px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { min-height: 44px; padding: 6px 4px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; line-height: 1.15; }
.follow .seg button { font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; min-height: 124px; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: left; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; transition: transform .12s ease, background .12s ease, border-color .12s ease; }
.tile svg { width: 100%; height: 62px; display: block; }
.tile .lab { font-weight: 700; font-size: 15px; line-height: 1.2; padding-right: 30px; }
.tile.vu { background: var(--moss-bg); border: 2.5px solid var(--moss); padding: 7px 7px 9px; }
.tile.ns { background: var(--amber-bg); border: 2.5px solid var(--amber-line); padding: 7px 7px 9px; }
.tile.pressing { transform: scale(.97); }
.badge { position: absolute; top: 6px; left: 6px; width: 26px; height: 26px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; }
.tile.vu .badge { display: flex; background: var(--moss); }
.tile.ns .badge { display: flex; background: var(--amber); }
.unsure { position: absolute; right: 6px; bottom: 6px; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.tile.ns .unsure { background: var(--amber); border-color: var(--amber); color: #fff; }
.follow { grid-column: 1 / -1; background: var(--card); border: 1.5px dashed var(--moss); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; animation: drop .18s ease; }
.follow p { margin: 0; font-size: 15px; font-weight: 700; }
.follow .ex { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--moss); text-decoration: underline; font-size: 14px; }
.follow.err { border-color: var(--high); }
.errmsg { color: var(--high); font-size: 14px; font-weight: 700; margin: 0; }
@keyframes drop { from { opacity: .3; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.chip[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: #fff; }
.chip[aria-pressed="true"]::before { content: "✓ "; }
.fold { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.fold > button { width: 100%; text-align: left; background: none; border: 0; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.fold > button span:last-child { color: var(--muted); font-size: 14px; font-weight: 400; }
.fold .inner { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.fold .inner p { margin: 0; font-size: 14px; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); text-align: left; font-size: 15px; width: 100%; }
.check .box { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.check[aria-pressed="true"] { border-color: var(--moss); background: var(--moss-bg); }
.check[aria-pressed="true"] .box { background: var(--moss); border-color: var(--moss); }
.check[aria-pressed="true"] .box::after { content: "✓"; }
.closing { background: var(--ink); color: #fff; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.closing p { margin: 0; font-weight: 700; font-size: 16px; }
.closing small { color: #C9D3CC; font-size: 13px; }
.closing .seg button { background: transparent; color: #fff; border-color: #56645B; }
.closing .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
.closing.err { outline: 3px solid var(--high); }
.closing .errmsg { color: #FFB4AB; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(237,240,234,.96); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.bar-in { max-width: 480px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.bar-in .count { flex: 1; font-size: 14px; color: var(--muted); }
.bar-in .count b { color: var(--ink); }
.primary { min-height: 50px; padding: 0 22px; border-radius: 12px; border: 0; background: var(--moss); color: #fff; font-weight: 700; font-size: 17px; }
.ghost { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; }
.sheet-wrap { position: fixed; inset: 0; background: rgba(19,32,26,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; animation: fade .15s ease; }
.sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; animation: up .2s ease; }
.sheet .grabzone { margin: -14px -16px -6px; padding: 12px 16px 14px; display: flex; justify-content: center; cursor: grab; touch-action: none; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet .grabzone:active .grab, .sheet.dragging .grab { background: var(--muted); }
.sheet.dragging { animation: none; }
.sheet.settle { transition: transform .2s ease; }
.sheet-wrap.closing { transition: background-color .2s ease; background: rgba(19,32,26,0); }
.sheet .pic { background: #F4F6F1; border-radius: 12px; padding: 10px; border: 1px solid var(--line); }
.sheet .pic svg { width: 100%; height: 170px; display: block; }
.sheet { max-height: 94vh; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain; }
.gal { margin: 0 -4px; }
.gal .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; padding: 0 4px; scrollbar-width: none; overscroll-behavior-x: contain; }
.gal .track::-webkit-scrollbar { display: none; }
.gal figure { position: relative; flex: 0 0 100%; margin: 0; scroll-snap-align: center; display: flex; flex-direction: column; gap: 6px; }
.gal img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 12px; background: #1F2A24; display: block; }
.gal figcaption { display: flex; flex-direction: column; gap: 2px; }
.gal .cap { font-size: 15px; font-weight: 700; line-height: 1.3; }
.gal .cr { font-size: 11px; color: var(--muted); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gal .tag { position: absolute; top: 8px; left: 8px; padding: 4px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; background: var(--moss); }
.gal figure.no .tag { background: var(--high); }
.gal figure.no img { outline: 3px solid var(--high); outline-offset: -3px; }
.gal .dots { display: flex; justify-content: center; gap: 6px; padding-top: 8px; }
.gal .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.gal .dots i.on { background: var(--ink); }
.sheet p { margin: 0; font-size: 16px; }
.sheet .note { font-size: 13px; color: var(--muted); }
.sheet .acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.sheet .acts.one { grid-template-columns: 1fr; }
@keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
/* Résultat */
.verdict { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border: 2px solid; }
.verdict .k { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.verdict h1 { font-size: 30px; }
.verdict p { margin: 0; font-size: 15px; }
.lv-2 { background: var(--high-bg); border-color: var(--high); color: var(--high); }
.lv-1 { background: var(--mid-bg); border-color: var(--mid); color: var(--mid); }
.lv-0 { background: var(--low-bg); border-color: var(--low); color: var(--low); }
.verdict p, .verdict ul { color: var(--ink); }
.why { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.rows { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .nm { flex: 1; min-width: 0; }
.row .nm b { display: block; font-size: 15px; }
.row .nm span { display: block; font-size: 13px; color: var(--muted); }
.pill { flex: none; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1.5px solid; }
.alerts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.alerts li { background: var(--card); border-left: 4px solid var(--mid); border-radius: 0; padding: 10px 12px; font-size: 15px; }
.foot { font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }
/* Illustrations */
.s { stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.n { fill: none; }
.dash { stroke-dasharray: 4 4; }
.fl { fill: var(--il-leaf); } .fl2 { fill: var(--il-leaf2); } .fg { fill: var(--il-grass); } .ff { fill: var(--il-field); }
.fw { fill: var(--il-water); } .fb { fill: var(--il-bark); } .fb2 { fill: var(--il-bark2); } .fwall { fill: var(--il-wall); }
.fr { fill: var(--il-roof); } .fd { fill: var(--il-dark); } .fs { fill: var(--il-stone); } .fm { fill: var(--il-mud); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

  h += `</div>`;
  const nb = BONUS.filter(b => S.bonus[b.k]).length;
  h += `<div class="fold"><button type="button" id="bonusBtn" aria-expanded="${S.bonusOpen}"><span>Un occupant ou le gestionnaire est présent ?</span><span>${nb ? nb + " confirmé" + (nb > 1 ? "s" : "") : "facultatif"} ${S.bonusOpen ? "▴" : "▾"}</span></button>`;
  if (S.bonusOpen) {
    h += `<div class="inner"><p>Cochez seulement ce que votre interlocuteur confirme avoir constaté lui-même.</p>` +
      BONUS.map(b => `<button type="button" class="check" data-bonus="${b.k}" aria-pressed="${!!S.bonus[b.k]}"><span class="box" aria-hidden="true"></span><span>${b.lab}</span></button>`).join("") + "</div>";
  }
  h += `</div>
  <div class="closing ${S.errs.tour ? "err" : ""}" id="closing"><p>Avez-vous fait le tour des espaces extérieurs ?</p>
    <small>Ce qui n'est pas coché sera considéré comme absent si vous avez fait le tour complet.</small>
    ${seg("tour", S.tour, [["oui","Oui"],["partie","En partie"],["non","Non"]])}
    ${S.errs.tour ? '<p class="errmsg">Répondez à cette question pour terminer.</p>' : ""}</div>`;
  $("#app").innerHTML = h;
  const vu = Object.values(S.el).filter(v => v === 1).length + Object.values(S.ani).filter(Boolean).length;
  const ns = Object.values(S.el).filter(v => v === 2).length;
  $("#bar").innerHTML = `<div class="bar-in"><div class="count"><b>${vu}</b> élément${vu > 1 ? "s" : ""} vu${vu > 1 ? "s" : ""}${ns ? ` · <b>${ns}</b> pas sûr` : ""}</div><button type="button" class="primary" id="finish">Terminer</button></div>`;
  $("#bar").style.display = "";
  bindReleve();
}

let pressGuard = 0;
const clearSel = () => { try { const sel = window.getSelection(); if (sel && sel.rangeCount) sel.removeAllRanges(); } catch (er) {} };
document.addEventListener("selectstart", e => { if (Date.now() < pressGuard && !e.target.closest?.("input, textarea")) e.preventDefault(); });
function bindPress(el, onTap, onLong) {
  let t = null, long = false, x = 0, y = 0;
  el.addEventListener("pointerdown", e => {
    if (e.target.closest(".unsure")) return;
    long = false; x = e.clientX; y = e.clientY; el.classList.add("pressing"); pressGuard = Date.now() + 1500;
    t = setTimeout(() => { long = true; el.classList.remove("pressing"); if (navigator.vibrate) { try { navigator.vibrate(15); } catch (er) {} } onLong(); clearSel(); setTimeout(clearSel, 120); setTimeout(clearSel, 400); }, 450);
  });
  const cancel = () => { clearTimeout(t); el.classList.remove("pressing"); };
  el.addEventListener("pointermove", e => { if (Math.abs(e.clientX - x) > 10 || Math.abs(e.clientY - y) > 10) cancel(); });
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("pointerup", e => { if (long) { clearSel(); setTimeout(clearSel, 50); } if (e.target.closest(".unsure")) return; const was = t; cancel(); if (!long && was) onTap(); t = null; });
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onTap(); } if (e.key.toLowerCase() === "e") onLong(); });
}

function bindReleve() {
  $("#site").addEventListener("input", e => { S.site = e.target.value; save(); });
  document.querySelectorAll("[data-tile]").forEach(el => {
    const k = el.dataset.tile;
    bindPress(el, () => { S.el[k] = S.el[k] === 1 ? 0 : 1; save(); rerender(); }, () => openSheet(k));
  });
  document.querySelectorAll("[data-unsure]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); const k = b.dataset.unsure; S.el[k] = S.el[k] === 2 ? 0 : 2; save(); rerender();
  }));
  document.querySelectorAll("[data-seg]").forEach(b => b.addEventListener("click", () => {
    const n = b.dataset.seg, v = b.dataset.v;
    if (n.startsWith("F:")) { const k = n.slice(2); S.fol[k] = S.fol[k] === v ? null : v; delete S.errs[k]; }
    else if (n === "tour") { S.tour = v; delete S.errs.tour; }
    else S.proj[n] = S.proj[n] === v ? null : v;
    save(); rerender();
  }));
  document.querySelectorAll("[data-ex]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.ex)));
  document.querySelectorAll("[data-ani]").forEach(el => {
    const k = el.dataset.ani;
    bindPress(el, () => { S.ani[k] = !S.ani[k]; save(); rerender(); }, () => openSheet(k));
  });
  document.querySelectorAll("[data-bonus]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.bonus; S.bonus[k] = !S.bonus[k]; save(); rerender(); }));
  $("#bonusBtn").addEventListener("click", () => { S.bonusOpen = !S.bonusOpen; save(); rerender(); });
  $("#projBtn").addEventListener("click", () => { S.projOpen = !S.projOpen; save(); rerender(); });
  $("#finish").addEventListener("click", finish);
}

function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

function openSheet(k) {
  const a = ANIMALS.find(x => x.k === k);
  const isTile = !!EL[k], isFol = !!FOLLOW[k];
  const title = isTile ? EL[k].lab : isFol ? FOLLOW[k].q : a.lab;
  const desc = isTile ? EL[k].d : isFol ? FOLLOW[k].d : a.d;
  const pic = PHOTOS[k] && PHOTOS[k].length ? gallery(k) : SVG[k] ? `<div class="pic">${svg(k, true)}</div>` : "";
  const acts = isTile
    ? `<div class="acts"><button type="button" class="primary" data-sa="vu">Je l'ai vu</button><button type="button" class="ghost" data-sa="ns">Pas sûr</button><button type="button" class="ghost" data-sa="x">Fermer</button></div>`
    : `<div class="acts one"><button type="button" class="ghost" data-sa="x">Fermer</button></div>`;
  $("#layer").innerHTML = `<div class="sheet-wrap" id="sw"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grabzone" aria-hidden="true"><span class="grab"></span></div>${pic}<h2>${esc(title)}</h2><p>${esc(desc)}</p>${acts}</div></div>`;
  const close = () => { $("#layer").innerHTML = ""; };
  $("#sw").addEventListener("click", e => { if (e.target.id === "sw") close(); });
  bindSheetDrag($("#sw"), close);
  const tr = $("#sw .track"), dots = document.querySelectorAll("#sw .dots i");
  if (tr && dots.length) tr.addEventListener("scroll", () => { const i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth)); dots.forEach((dd, j) => dd.classList.toggle("on", i === j)); }, { passive: true });
  document.querySelectorAll("[data-sa]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.sa === "vu") S.el[k] = 1;
    if (b.dataset.sa === "ns") S.el[k] = 2;
    save(); close(); if (b.dataset.sa !== "x") rerender();
  }));
  const f = $("#layer button"); if (f) f.focus();
}

// Glisser la barre du haut vers le bas pour fermer la fiche
function bindSheetDrag(wrap, close) {
  const sheet = wrap.querySelector(".sheet"), zone = wrap.querySelector(".grabzone");
  if (!sheet || !zone) return;
  let y0 = 0, t0 = 0, dy = 0, id = null;
  const setY = v => { sheet.style.transform = v ? `translateY(${v}px)` : ""; wrap.style.backgroundColor = `rgba(19,32,26,${(0.45 * Math.max(0, 1 - v / (sheet.offsetHeight || 400))).toFixed(3)})`; };
  zone.addEventListener("pointerdown", e => {
    id = e.pointerId; y0 = e.clientY; t0 = performance.now(); dy = 0;
    sheet.classList.remove("settle"); sheet.classList.add("dragging");
    try { zone.setPointerCapture(id); } catch (er) {}
    e.preventDefault();
  });
  zone.addEventListener("pointermove", e => {
    if (e.pointerId !== id) return;
    dy = Math.max(0, e.clientY - y0); setY(dy);
  });
  const end = e => {
    if (e.pointerId !== id) return;
    id = null; sheet.classList.remove("dragging");
    const v = dy / Math.max(1, performance.now() - t0);
    sheet.classList.add("settle");
    if (dy > Math.min(120, sheet.offsetHeight * 0.25) || (dy > 30 && v > 0.6)) {
      wrap.classList.add("closing"); wrap.style.backgroundColor = "";
      sheet.style.transform = `translateY(${sheet.offsetHeight + 40}px)`;
      setTimeout(close, 200);
    } else { setY(0); wrap.style.backgroundColor = ""; }
  };
  zone.addEventListener("pointerup", end);
  zone.addEventListener("pointercancel", end);
}

function finish() {
  S.errs = {};
  for (const [fk, f] of Object.entries(FOLLOW)) if (S.el[f.parent] === 1 && !S.fol[fk]) S.errs[fk] = true;
  if (!S.tour) S.errs.tour = true;
  if (Object.keys(S.errs).length) {
    rerender();
    const first = Object.keys(S.errs).find(k => k !== "tour");
    const target = first ? $("#f-" + first) : $("#closing");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  S.view = "res"; save(); render(); window.scrollTo(0, 0);
}

function compute() {
  const untapped = S.tour === "oui" ? 0 : NSP;
  const val = k => {
    if (EL[k]) { const s = S.el[k] || 0; return s === 1 ? 1 : s === 2 ? NSP : untapped; }
    const f = FOLLOW[k], p = val(f.parent);
    if (p === 0) return 0;
    if (S.el[f.parent] === 1) { const a = S.fol[k]; return a === "oui" ? 1 : a === "non" ? 0 : NSP; }
    return NSP;
  };
  const yes = k => val(k) === 1;
  const groups = GROUPS.map((g, i) => {
    let num = 0, den = 0;
    for (const k in W) { num += W[k][i] * val(k); den += W[k][i]; }
    const score = den ? num / den : 0;
    const cls = score >= SF ? 2 : score >= SM ? 1 : 0;
    let floor = 0, why = null;
    for (const [gi, a, b, lv, lab] of RULES) if (gi === i && yes(a) && (!b || yes(b)) && lv > floor) { floor = lv; why = lab; }
    const obs = ANIMALS.some(a => a.g === i && S.ani[a.k]);
    const said = BONUS.some(b => b.g === i && S.bonus[b.k]);
    const niv = obs || said ? 3 : Math.max(cls, floor);
    const vig = MAT[g.s][niv];
    let reason = obs ? "Observés pendant la visite" : said ? "Signalés par un occupant"
      : why && floor >= cls ? why.charAt(0).toUpperCase() + why.slice(1) + " (élément déterminant)"
      : cls ? "Plusieurs milieux favorables" : "Peu de milieux favorables";
    return { n: g.n, per: g.per, vig, reason, score };
  });
  let zh = 0; const zhw = [];
  if (yes("E3")) zhw.push("eau stagnante ou boue"); if (yes("E4")) zhw.push("roseaux ou joncs"); if (S.bonus.I6) zhw.push("inondation signalée chaque hiver");
  if (zhw.length) zh = 2;
  else if (yes("A2") || val("E3") === NSP || val("E4") === NSP) { zh = 1; zhw.push(yes("A2") ? "eau à proximité" : "éléments non vérifiés"); }
  const global = Math.max(zh, ...groups.map(g => g.vig));
  const alerts = [];
  if (coldSeason()) alerts.push("Visite entre octobre et février : peu d'animaux sont visibles, le résultat repose sur les milieux décrits.");
  if (S.tour !== "oui") alerts.push("Tour des espaces extérieurs incomplet : les éléments non cochés sont comptés comme incertains.");
  if (S.proj.P1 === "oui" && (yes("B3") || yes("B4") || S.ani.F1 || S.ani.F2 || S.bonus.I1 || S.bonus.I2))
    alerts.push("Travaux sur des bâtiments pouvant abriter chauves-souris ou oiseaux protégés : faire expertiser les bâtiments avant travaux, avec un calendrier adapté.");
  if (S.proj.P2 === "oui" && ["V2","V3","V4","V5","S1","E1","E3","E4"].some(yes))
    alerts.push("Aménagement envisagé sur des espaces favorables à la faune ou potentiellement humides : les éléments listés plus haut sont à éviter en priorité. Abattages et défrichements hors période de nidification (mi-mars à fin août).");
  if (S.bonus.I7) alerts.push("Une étude environnementale existe : la récupérer, elle peut confirmer ou lever les enjeux.");
  const nsp = Object.values(S.el).filter(v => v === 2).length + Object.values(S.fol).filter(v => v === "nsp").length;
  let fi = S.tour === "oui" ? 0 : S.tour === "partie" ? 1 : 2;
  if (nsp >= 3) fi++; if (nsp >= 6) fi++; fi = Math.min(fi, 2);
  const elems = [];
  for (const [k, l, g] of ELEMS) {
    if ((k === "V2" || k === "S1") && yes(k + "b")) continue;
    const v = val(k);
    if (v === 1) elems.push({ l, g, v: false });
    else if ((EL[k] && S.el[k] === 2) || (FOLLOW[k] && S.el[FOLLOW[k].parent] === 1 && S.fol[k] === "nsp")) elems.push({ l, g, v: true });
  }
  if (S.bonus.I6) elems.push({ l: "Partie du site inondée chaque hiver", g: "zone humide possible, signalée par un occupant", v: false });
  return { groups, zh, zhw, global, alerts, elems, fiab: ["bonne", "moyenne", "faible"][fi], nsp };
}

function elemsHtml(R) {
  const items = R.elems;
  if (!items.length) return `<section><div class="sec-head"><h2>Éléments à préserver</h2></div><p class="foot">Aucun élément sensible relevé.</p></section>`;
  return `<section><div class="sec-head"><h2>Éléments à préserver</h2><small>pour la conception</small></div><div class="rows">` +
    items.map(e => `<div class="row"><div class="nm"><b>${e.l}</b><span>${e.g}</span></div>${e.v ? '<span class="pill lv-1">À vérifier</span>' : ""}</div>`).join("") + `</div></section>`;
}

function renderRes() {
  const R = compute();
  const G = GLOBAL[R.global];
  const order = R.groups.map((g, i) => ({ ...g, i })).sort((a, b) => b.vig - a.vig || b.score - a.score);
  const why = order.filter(g => g.vig === R.global && R.global > 0).slice(0, 4).map(g => `<li><b>${g.n}</b> : ${g.reason.charAt(0).toLowerCase() + g.reason.slice(1)}</li>`);
  if (R.zh === R.global && R.zh > 0) why.unshift(`<li><b>Zones humides</b> : ${R.zhw.join(", ")}</li>`);
  const dateTxt = new Date(S.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  let h = `<header class="top"><div class="eyebrow"><span>${esc(S.site)} · ${esc(dateTxt)}</span></div></header>
  <div class="verdict lv-${R.global}"><span class="k">Sensibilité biodiversité du site</span><h1>${G.t}</h1><p>${G.c}</p>${why.length ? `<ul class="why">${why.join("")}</ul>` : ""}</div>
  ${elemsHtml(R)}
  <section><div class="sec-head"><h2>Par groupe</h2><small>sensibilité</small></div><div class="rows">` +
    order.map(g => `<div class="row"><div class="nm"><b>${g.n}</b><span>${g.reason}${g.vig ? " · inventaire : " + g.per : ""}</span></div><span class="pill lv-${g.vig}">${LV[g.vig]}</span></div>`).join("") +
    `</div></section>
  <section><div class="sec-head"><h2>Zones humides</h2></div><div class="rows"><div class="row"><div class="nm"><b>${R.zh === 2 ? "Indices relevés" : R.zh === 1 ? "À vérifier" : "Aucun indice"}</b><span>${R.zhw.length ? R.zhw.join(", ") : "Ni eau stagnante ni plantes de bord d'eau relevées."}${R.zh === 2 ? " · secteur à éviter ; au-delà de 0,1 ha touché, dossier loi sur l'eau (rubrique 3.3.1.0)." : ""}</span></div><span class="pill lv-${R.zh}">${LV[R.zh]}</span></div></div></section>`;
  if (R.alerts.length) h += `<section><div class="sec-head"><h2>Points d'attention</h2></div><ul class="alerts">${R.alerts.map(a => `<li>${a}</li>`).join("")}</ul></section>`;
  h += `<p class="foot">Fiabilité du relevé : <b>${R.fiab}</b>${R.nsp ? ` (${R.nsp} réponse${R.nsp > 1 ? "s" : ""} « pas sûr »)` : ""}. Repérage très préliminaire, établi par un non-spécialiste en une visite ; il ne remplace pas un diagnostic écologique.</p>
  <div class="actions"><button type="button" class="ghost" id="edit">Modifier le relevé</button><button type="button" class="ghost" id="copy">Copier la synthèse</button><button type="button" class="ghost" id="reset">Nouveau relevé</button></div>`;
  $("#app").innerHTML = h;
  $("#bar").style.display = "none";
  $("#edit").addEventListener("click", () => { S.view = "releve"; save(); render(); window.scrollTo(0, 0); });
  $("#copy").addEventListener("click", async () => {
    const txt = [`${G.t}`, `${S.site} (${dateTxt})`, G.c, "", ...(R.elems.length ? ["Éléments à préserver :", ...R.elems.map(e => `- ${e.l} (${e.g})${e.v ? " : à vérifier" : ""}`), ""] : []),
      ...order.map(g => `- ${g.n} : ${LV[g.vig]} (${g.reason})`), `- Zones humides : ${LV[R.zh]}${R.zhw.length ? " (" + R.zhw.join(", ") + ")" : ""}`,
      ...(R.alerts.length ? ["", "Points d'attention :", ...R.alerts.map(a => "- " + a)] : []), "", `Fiabilité : ${R.fiab}`].join("\n");
    try { await navigator.clipboard.writeText(txt); toast("Synthèse copiée"); } catch (e) { toast("Copie impossible depuis ce navigateur"); }
  });
  const rb = $("#reset"); let armed = false;
  rb.addEventListener("click", () => {
    if (!armed) { armed = true; rb.textContent = "Confirmer l'effacement"; rb.style.borderColor = "var(--high)"; rb.style.color = "var(--high)"; setTimeout(() => { if (armed) { armed = false; rb.textContent = "Nouveau relevé"; rb.style.cssText = ""; } }, 3500); return; }
    S = fresh(); S.site = ""; save(); render(); window.scrollTo(0, 0);
  });
}

function toast(m) { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function render() { S.view === "res" ? renderRes() : renderReleve(); }

window.claude?.hot?.snapshot?.(() => S);
const start = data => { if (data && data.view) S = Object.assign(fresh(), data); render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
